# Goal - I have to build Lint, Build, test the code foor Frontend, Backend  and 
# then push the images to dockerhub
name: CI
on:
  push: 
    branches: [advanced]

jobs: 
    
    frontend:
        runs-on: ubuntu-latest
        steps:  
          - name: Checkout code
            uses: actions/checkout@v7

          - name: Setup Nodejs
            uses: actions/setup-node@v6
            with: 
              node-version: '20' 
              cache: npm
              # used to specify path of a dependency file like package-lock
              cache-dependency-path: frontend/package-lock.json
          - name: Install npm packages
            run:  npm install 
            working-directory: frontend

          - name:  Run Linter
            run:  npm run lint 
            working-directory: frontend

          - name: Run tests
            run: npm run test
            working-directory: frontend

          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}
          
          - name: Build frontend image
            uses: docker/build-push-action@v5
            with:
              context: ./frontend
              file: ./frontend/Dockerfile
              push: true
              tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend-master:latest
    
    backend:
        runs-on: ubuntu-latest
        steps:  
          - name: Checkout code
            uses: actions/checkout@v7

          - name: Setup go
            uses: actions/setup-go@v6
            with:
    # Version or version range of Go to use
              go-version: '1.23'
              go-version-file: 'go.mod'
              cache-dependency-path: 'go.sum'

          
          - name: Run go formatter  
            run:  go fmt  
            working-directory: backend

          - name:  Run go vet
            run:  go vet
            working-directory: backend

          - name: Run tests in go
            run: go test
            working-directory: backend

          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}
          
          - name: Build frontend image
            uses: docker/build-push-action@v5
            with:
              context: ./backend
              file: ./backend/Dockerfile
              push: true
              tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend-master:latest