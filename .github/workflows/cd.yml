#Goal - to deploy image from ci.yml once CI workflow is succeeded.
name: CD
on:
    workflow_call:
        
jobs:
    deploy:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: k8s
        steps:  
            - name: Code checkout
              uses: actions/checkout@v7
            
            - name: Copy Example env tomain env
              run: cp .env.example .env
              
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Deploy the containers using docker compose
              run:  |
                docker compose pull
                docker compose up -d 